# === Shared tmux config (all machines) ===
# devsrc worktree 전략과 맞물리는 구성: 세션=repo, 윈도우=worktree/브랜치.
# 상세 사용법: docs/mac-dev-setup-guide.md 또는 machines/<host>/README.md 참고.

# --- Prefix: C-b(기본) → C-a (손이 가까움) ---
# C-a C-a 로 실제 "줄 맨 앞 이동"(readline)을 그대로 통과시킴 (screen 관례)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 기본 인덱스/렌더링 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10          # nvim 모드 전환 지연 제거
set -g mouse on
set -g focus-events on

# --- 트루컬러 (Powerlevel10k/터미널 색 그대로) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- 분할: 현재 pane 경로 유지, 기억하기 쉬운 키 ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- pane 이동: vim 스타일 ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 설정 리로드 ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- copy-mode: vi 키 + macOS 클립보드 ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# --- devsrc 세션 스위처 (fzf 팝업) ---
bind f display-popup -E -w 80% -h 80% "~/devsrc/dotfiles/shared/bin/tmux-sessionizer.sh"

# --- 상태바: 세션 / 윈도우 / (우측) git 브랜치 · 호스트 · 시각 ---
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left " #[bold,fg=#7aa2f7]#S #[fg=#565f89]| "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "
set -g window-status-format "#[fg=#a9b1d6] #I:#W "
set -g status-right-length 60
set -g status-right "#[fg=#9ece6a]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null) #[fg=#565f89]| #[fg=#e0af68]#h #[fg=#565f89]| #[fg=#a9b1d6]%H:%M "

# --- 플러그인 (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
